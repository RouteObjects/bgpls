frr defaults traditional
hostname p1
log stdout
!
interface lo
 ! One passive loopback per family shares the existing IS-IS topology.
 ip address 10.255.0.3/32
 ipv6 address 2001:db8:6501::3/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
!
interface eth1
 ip address 10.254.0.1/31
 ipv6 address 2001:db8:6501:1::1/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
interface eth2
 ip address 10.254.0.5/31
 ipv6 address 2001:db8:6501:3::1/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
interface eth3
 ip address 10.254.0.8/31
 ipv6 address 2001:db8:6501:5::0/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
interface eth4
 ip address 10.254.0.10/31
 ipv6 address 2001:db8:6501:6::0/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 ! Export loopback prefixes; numbered transit addresses remain link descriptors.
 advertise-passive-only
 log-adjacency-changes
 mpls-te on
 mpls-te router-address 10.255.0.3
!
! Advertise a separate discard-only test prefix, not the next-hop /32 itself.
! FRR import checking rejects a received prefix that resolves through itself.
ip route 192.0.2.3/32 Null0
!
router bgp 65001
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 ! IPv4 iBGP runs between loopbacks reachable through IS-IS.
 neighbor CORE peer-group
 neighbor CORE remote-as 65001
 neighbor CORE update-source lo
 neighbor 10.255.0.1 peer-group CORE
 neighbor 10.255.0.2 peer-group CORE
 !
 address-family ipv4 unicast
  ! Loopbacks remain in IS-IS; these TEST-NET routes exercise IPv4 reflection.
  network 192.0.2.3/32
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
!
