frr defaults traditional
hostname edge-frr
log stdout
!
interface lo
 ! One passive loopback per family shares the existing IS-IS topology.
 ip address 10.255.0.5/32
 ipv6 address 2001:db8:6501::5/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
!
interface eth1
 ip address 10.254.0.11/31
 ipv6 address 2001:db8:6501:6::1/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
interface eth2
 ip address 10.254.0.13/31
 ipv6 address 2001:db8:6501:7::1/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
! The dedicated relay link is not an IGP adjacency or advertised prefix.
interface eth3
 ip address 10.254.254.0/31
!
router isis CORE
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
 ! Export loopback prefixes; numbered transit addresses remain link descriptors.
 advertise-passive-only
 log-adjacency-changes
 mpls-te on
 mpls-te router-address 10.255.0.5
 ! Export this router's local IS-IS TED through Zebra to bgpd.
 mpls-te export
!
! Advertise a separate discard-only test prefix, not the next-hop /32 itself.
! FRR import checking rejects a received prefix that resolves through itself.
ip route 192.0.2.5/32 Null0
!
router bgp 65001
 bgp router-id 10.255.0.5
 no bgp default ipv4-unicast
 ! IPv4 iBGP runs between loopbacks reachable through IS-IS.
 neighbor CORE peer-group
 neighbor CORE remote-as 65001
 neighbor CORE update-source lo
 neighbor 10.255.0.1 peer-group CORE
 neighbor 10.255.0.2 peer-group CORE
 ! Native bgpls initiates TCP through the relay; the relay is not a speaker.
 neighbor 10.254.254.1 remote-as 65001
 neighbor 10.254.254.1 passive
 neighbor 10.254.254.1 timers 3 9
 !
 address-family ipv4 unicast
  ! Loopbacks remain in IS-IS; these TEST-NET routes exercise IPv4 reflection.
  network 192.0.2.5/32
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
 !
 ! Only the exporter sends BGP-LS; the two reflectors carry IPv4 unicast.
 address-family link-state
  neighbor 10.254.254.1 activate
 exit-address-family
!
