global
    log stdout format raw local0
    stats socket /tmp/haproxy.sock mode 600
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    # BGP keepalives keep this connection active; these are idle, not lifetime, limits.
    timeout client 1h
    timeout server 1h

frontend bgpls_frr
    bind :11790
    default_backend edge_frr

backend edge_frr
    #  The exporter matches its BGP neighbor by this non-IGP source address.
    # One collector per producer: extra TCP source ports do not create BGP peers.
    source 10.254.254.1
    # Raw BGP bytes only: do not add send-proxy, TLS, or HTTP checks.
    server edge_frr 10.254.254.0:179

#  Separate listeners/backends preserve one BGP session per producer.
frontend bgpls_ceos
    bind :11791
    default_backend edge_ceos

backend edge_ceos
    source 10.254.254.3
    server edge_ceos 10.254.254.2:179
