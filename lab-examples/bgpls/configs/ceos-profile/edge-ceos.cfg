! Bring-your-own cEOS ARM64 image; isolated demonstration, not production config.
hostname edge-ceos
service routing protocols model multi-agent
no aaa root
!
interface Management0
   ip address dhcp
!
interface Loopback0
   ! One passive loopback per family shares the existing IS-IS topology.
   ip address 10.255.0.6/32
   ipv6 address 2001:db8:6501::6/128
   isis enable CORE
   isis passive
!
interface Ethernet1
   no switchport
   ip address 10.254.0.15/31
   ipv6 address 2001:db8:6501:8::1/127
   isis enable CORE
   isis network point-to-point
   isis circuit-type level-2
   traffic-engineering
!
interface Ethernet2
   no switchport
   ip address 10.254.0.17/31
   ipv6 address 2001:db8:6501:9::1/127
   isis enable CORE
   isis network point-to-point
   isis circuit-type level-2
   traffic-engineering
!
! The collector-facing link is not part of IS-IS or its prefix export.
interface Ethernet3
   no switchport
   ip address 10.254.254.2/31
!
ip routing
ipv6 unicast-routing
ip route 192.0.2.6/32 Null0
!
router traffic-engineering
   router-id ipv4 10.255.0.6
   ! IPv6 IS-IS routing alone does not enable EOS's IPv6 TE link export.
   router-id ipv6 2001:db8:6501::6
!
router isis CORE
   net 49.0001.0000.0000.0006.00
   is-type level-2
   ! Match FRR's loopback-only prefix policy without hiding link addresses.
   advertise ip-reachability passive-only
   address-family ipv4 unicast
   ! All IGP links carry both families in one shared Level-2 topology.
   address-family ipv6 unicast
      no multi-topology
   !
   traffic-engineering
      no shutdown
      is-type level-2
!
router bgp 65001
   router-id 10.255.0.6
   no bgp default ipv4-unicast
   neighbor CORE peer group
   neighbor CORE remote-as 65001
   neighbor CORE update-source Loopback0
   neighbor 10.255.0.1 peer group CORE
   neighbor 10.255.0.2 peer group CORE
   neighbor 10.254.254.3 remote-as 65001
   neighbor 10.254.254.3 passive
   neighbor 10.254.254.3 timers 3 9
   !
   address-family ipv4
      network 192.0.2.6/32
      neighbor CORE activate
   !
   address-family link-state
      ! Originate from cEOS's own IS-IS LSDB, not FRR's BGP-LS feed.
      isis instance CORE
      neighbor 10.254.254.3 activate
!
end
