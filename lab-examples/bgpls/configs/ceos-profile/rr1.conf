frr defaults traditional
hostname rr1
log stdout
!
interface lo
 ! One passive loopback per family shares the existing IS-IS topology.
 ip address 10.255.0.1/32
 ipv6 address 2001:db8:6501::1/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
!
interface eth1
 ip address 10.254.0.0/31
 ipv6 address 2001:db8:6501:1::0/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
interface eth2
 ip address 10.254.0.2/31
 ipv6 address 2001:db8:6501:2::0/127
 ip router isis CORE
 ipv6 router isis CORE
 isis circuit-type level-2
 isis network point-to-point
 ! Enable the link's TE parameters for the IS-IS database exported through BGP-LS.
 link-params
 exit-link-params
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 ! Export loopback prefixes; numbered transit addresses remain link descriptors.
 advertise-passive-only
 log-adjacency-changes
 mpls-te on
 mpls-te router-address 10.255.0.1
!
! Advertise a separate discard-only test prefix, not the next-hop /32 itself.
! FRR import checking rejects a received prefix that resolves through itself.
ip route 192.0.2.1/32 Null0
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 ! IPv4 iBGP runs between loopbacks reachable through IS-IS.
 neighbor CORE peer-group
 neighbor CORE remote-as 65001
 neighbor CORE update-source lo
 neighbor 10.255.0.2 peer-group CORE
 neighbor 10.255.0.3 peer-group CORE
 neighbor 10.255.0.4 peer-group CORE
 neighbor 10.255.0.5 peer-group CORE
 neighbor 10.255.0.6 peer-group CORE
 !
 address-family ipv4 unicast
  ! Loopbacks remain in IS-IS; these TEST-NET routes exercise IPv4 reflection.
  network 192.0.2.1/32
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 route-reflector-client
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 route-reflector-client
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.5 route-reflector-client
  neighbor 10.255.0.6 activate
  neighbor 10.255.0.6 route-reflector-client
  ! The other reflector is a normal iBGP peer, not a reflector client.
 exit-address-family
!
