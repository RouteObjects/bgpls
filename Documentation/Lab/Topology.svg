<rect x="900" y="160" width="490" height="555" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1145.0" y="282.62999999999994" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="1145.0" dy="0">IS-IS Level 2 · dual-stack</tspan>
<tspan x="1145.0" dy="22.950000000000003"></tspan>
<tspan x="1145.0" dy="22.950000000000003">L1   rr1:eth1 ↔ p1:eth1</tspan>
<tspan x="1145.0" dy="22.950000000000003">L2   rr1:eth2 ↔ p2:eth1</tspan>
<tspan x="1145.0" dy="22.950000000000003">L3   rr2:eth1 ↔ p1:eth2</tspan>
<tspan x="1145.0" dy="22.950000000000003">L4   rr2:eth2 ↔ p2:eth2</tspan>
<tspan x="1145.0" dy="22.950000000000003">L5   p1:eth3 ↔ p2:eth3  (churn)</tspan>
<tspan x="1145.0" dy="22.950000000000003">L6   p1:eth4 ↔ edge-frr:eth1</tspan>
<tspan x="1145.0" dy="22.950000000000003">L7   p2:eth4 ↔ edge-frr:eth2</tspan>
<tspan x="1145.0" dy="22.950000000000003">L8   p1:eth5 ↔ edge-ceos:eth1</tspan>
<tspan x="1145.0" dy="22.950000000000003">L9   p2:eth5 ↔ edge-ceos:eth2</tspan>
<tspan x="1145.0" dy="22.950000000000003"></tspan>
<tspan x="1145.0" dy="22.950000000000003">Collector links · outside IS-IS</tspan>
<tspan x="1145.0" dy="22.950000000000003">C1   edge-frr:eth3 ↔ relay:eth1</tspan>
<tspan x="1145.0" dy="22.950000000000003">C2   edge-ceos:eth3 ↔ relay:eth2</tspan>
</text>
<rect x="900" y="745" width="490" height="165" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="1145.0" y="798.855" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="1145.0" dy="0">Management: bgpls / 172.31.250.0/24</tspan>
<tspan x="1145.0" dy="22.950000000000003">Every container has a separate eth0.</tspan>
<tspan x="1145.0" dy="22.950000000000003">rr1 .11 · rr2 .12 · p1 .13 · p2 .14</tspan>
<tspan x="1145.0" dy="22.950000000000003">edge-frr .15 · relay .16 · edge-ceos .17</tspan>
</text>
<text x="40" y="60.2" text-anchor="start" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">
