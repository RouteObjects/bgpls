    <rect stroke-width="1" id="control-rule" x="0" y="38" width="253" height="1" rx="0" fill="#49606c" stroke="none" />
    <text font-family="Menlo, Monaco, monospace" font-size="17" font-weight="400" text-anchor="start" id="control-cmd" x="15" y="67.865" fill="#ffffff">churn-link.sh</text>
    <text font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" id="control-purpose" x="15" y="99.175" fill="#ccdae1">Takes the link down or up</text>
  </g>
