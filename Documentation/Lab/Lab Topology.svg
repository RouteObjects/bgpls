<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1120" height="646" viewBox="0 0 1120 646" role="img">
  <title id="title">How the two macOS terminals connect to the FRR lab</title>
  <desc id="desc">The Collector opens TCP to 127.0.0.1:11790. HAProxy in bgpls-relay forwards the connection to edge-frr on port 179. BGP-LS updates return along the same session. The Control terminal runs churn-link.sh through OrbStack and Docker to take eth3 down or up on p1 and p2. The IS-IS topology change reaches edge-frr. An optional VS Code window views the lab through Remote–SSH.</desc>
  <defs>
    <marker id="arrow-16638b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16638b" />
    </marker>
    <marker id="arrow-99511c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#99511c" />
    </marker>
    <marker id="arrow-536775" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536775" />
    </marker>
  </defs>
  <rect stroke-width="1" id="canvas" x="0" y="0" width="1120" height="646" rx="0" fill="#ffffff" stroke="none" />
  <text font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" id="heading" x="24" y="46.35" fill="#162e40">How the two terminals connect to the lab</text>
  <rect stroke-width="1" id="mac-zone" x="24" y="76" width="298" height="545" rx="12" fill="#f7fafc" stroke="#c6d3dc" />
  <rect stroke-width="1" id="guest-zone" x="512" y="76" width="584" height="545" rx="12" fill="#f3f7fa" stroke="#c6d3dc" />
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" id="mac-title" x="45" y="119.28" fill="#162e40">macOS</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" id="mac-description" x="45" y="149.02" fill="#435969">Native apps on your Mac</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" id="guest-title" x="533" y="119.28" fill="#162e40">OrbStack Linux machine · clab</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" id="guest-description" x="533" y="149.02" fill="#435969">Containerlab running five FRRouting routers and a TCP relay</text>
  <g id="collector" transform="translate(46,191)">
