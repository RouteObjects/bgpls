    <circle id="collector-light0" cx="15" cy="19" r="3.5" fill="#f18178" />
    <circle id="collector-light1" cx="27" cy="19" r="3.5" fill="#e6ba68" />
    <circle id="collector-light2" cx="39" cy="19" r="3.5" fill="#81bd9c" />
    <text font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" id="collector-name" x="56" y="25.555" fill="#ffffff">Collector</text>
    <rect stroke-width="1" id="collector-rule" x="0" y="38" width="253" height="1" rx="0" fill="#49606c" stroke="none" />
    <text font-family="Menlo, Monaco, monospace" font-size="17" font-weight="400" text-anchor="start" id="collector-cmd" x="15" y="67.865" fill="#ffffff">bgpls run --watch</text>
    <text font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" id="collector-purpose" x="15" y="99.175" fill="#ccdae1">Displays live topology updates</text>
  </g>
  <g id="relay" transform="translate(535,191)">
