    <text font-family="Menlo, Monaco, monospace" font-size="15" font-weight="400" text-anchor="start" id="producer-detail" x="13" y="96.675" fill="#435969">10.254.254.0:179</text>
  </g>
  <path stroke-width="2.5" marker-end="url(#arrow-16638b)" id="collector-opens" d="M 299 226.1 L 535 226.1" fill="none" stroke="#16638b" />
  <path stroke-width="2.5" marker-end="url(#arrow-16638b)" id="relay-forwards" d="M 716 226.1 L 866 226.1" fill="none" stroke="#16638b" />
  <path stroke-width="2.5" marker-end="url(#arrow-16638b)" id="producer-updates" d="M 866 272.9 L 716 272.9" fill="none" stroke="#16638b" />
  <path stroke-width="2.5" marker-end="url(#arrow-16638b)" id="collector-receives" d="M 535 272.9 L 299 272.9" fill="none" stroke="#16638b" />
  <text font-family="Menlo, Monaco, monospace" font-size="16" font-weight="700" text-anchor="middle" id="connect-port" x="417" y="209.52" fill="#16638b">127.0.0.1:11790</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" id="tcp-forward" x="791" y="209.175" fill="#16638b">TCP to port 179</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" id="received-updates" x="417" y="293.02" fill="#16638b">BGP-LS updates</text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" id="sent-updates" x="791" y="292.675" fill="#16638b">BGP-LS updates</text>
  <g id="control" transform="translate(46,374)">
