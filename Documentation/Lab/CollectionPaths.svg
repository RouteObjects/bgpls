<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Collection paths</title>
<desc id="desc">Collection paths for the bgpls reference lab. See the accompanying editable Topology.drawio and lab documentation.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 z" fill="context-stroke"/></marker></defs>
<path d="M325.0 340.0 L530.0 340.0" fill="none" stroke="#1673a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860.0 340.0 L1090.0 340.0" fill="none" stroke="#1673a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325.0 570.0 L530.0 570.0" fill="none" stroke="#b76a10" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860.0 570.0 L1090.0 570.0" fill="none" stroke="#b76a10" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="145" width="1360" height="55" rx="10" fill="#142c3c" stroke="#142c3c" stroke-width="1.5"/>
<text x="720.0" y="179.64" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">
<tspan x="720.0" dy="0">macOS Terminal → OrbStack Linux machine “clab” → Containerlab</tspan>
</text>
<rect x="50" y="270" width="275" height="140" rx="10" fill="#e9f5fc" stroke="#1673a8" stroke-width="1.5"/>
<text x="187.5" y="322.83" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="187.5" dy="0">Native bgpls · FRR RIB</tspan>
<tspan x="187.5" dy="22.950000000000003">127.0.0.1:11790</tspan>
<tspan x="187.5" dy="22.950000000000003">--bgp-identifier 192.0.2.101</tspan>
</text>
<rect x="530" y="270" width="330" height="140" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="695.0" y="322.83" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="695.0" dy="0">HAProxy listener :11790</tspan>
<tspan x="695.0" dy="22.950000000000003">relay eth1: 10.254.254.1/31</tspan>
<tspan x="695.0" dy="22.950000000000003">raw TCP forwarding</tspan>
</text>
<rect x="1090" y="270" width="300" height="140" rx="10" fill="#e9f5fc" stroke="#1673a8" stroke-width="1.5"/>
<text x="1240.0" y="322.83" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="1240.0" dy="0">edge-frr</tspan>
<tspan x="1240.0" dy="22.950000000000003">eth3: 10.254.254.0:179</tspan>
<tspan x="1240.0" dy="22.950000000000003">exports its IS-IS database</tspan>
</text>
<rect x="50" y="500" width="275" height="140" rx="10" fill="#fff3df" stroke="#b76a10" stroke-width="1.5"/>
<text x="187.5" y="552.8299999999999" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="187.5" dy="0">Native bgpls · cEOS RIB</tspan>
<tspan x="187.5" dy="22.950000000000003">127.0.0.1:11791</tspan>
<tspan x="187.5" dy="22.950000000000003">--bgp-identifier 192.0.2.102</tspan>
</text>
<rect x="530" y="500" width="330" height="140" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="695.0" y="552.8299999999999" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="695.0" dy="0">HAProxy listener :11791</tspan>
<tspan x="695.0" dy="22.950000000000003">relay eth2: 10.254.254.3/31</tspan>
<tspan x="695.0" dy="22.950000000000003">raw TCP forwarding</tspan>
</text>
<rect x="1090" y="500" width="300" height="140" rx="10" fill="#fff3df" stroke="#b76a10" stroke-width="1.5"/>
<text x="1240.0" y="552.8299999999999" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="1240.0" dy="0">edge-ceos</tspan>
<tspan x="1240.0" dy="22.950000000000003">Ethernet3: 10.254.254.2:179</tspan>
<tspan x="1240.0" dy="22.950000000000003">exports its IS-IS database</tspan>
</text>
<rect x="40" y="700" width="650" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365.0" y="759.67" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">
<tspan x="365.0" dy="0">Separate IPv4-unicast iBGP</tspan>
<tspan x="365.0" dy="24.3">rr1 ↔ rr2: ordinary iBGP peers</tspan>
<tspan x="365.0" dy="24.3">p1, p2, edge-frr (+ edge-ceos) → both reflectors</tspan>
<tspan x="365.0" dy="24.3">No BGP-LS route reflection in this example.</tspan>
</text>
<rect x="720" y="700" width="680" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1060.0" y="759.67" text-anchor="middle" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">
<tspan x="1060.0" dy="0">One collector at a time per producer</tspan>
<tspan x="1060.0" dy="24.3">FRR-only: 5 nodes / 14 links / 10 prefixes</tspan>
<tspan x="1060.0" dy="24.3">Paired: 6 / 18 / 12 independently from each producer</tspan>
<tspan x="1060.0" dy="24.3">Optional IPv6 transport connects directly in relay namespace.</tspan>
</text>
<text x="40" y="60.2" text-anchor="start" fill="#142c3c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">
<tspan x="40" dy="0">Collection paths</tspan>
</text>
<text x="40" y="106.44" text-anchor="start" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
<tspan x="40" dy="0">Two independent producers, two independent RIBs. The default manual demo uses IPv4 TCP.</tspan>
</text>
<text x="427.5" y="309.64" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
<tspan x="427.5" dy="0">Docker-published</tspan>
<tspan x="427.5" dy="21.6">localhost ports</tspan>
</text>
<text x="977.5" y="309.64" text-anchor="middle" fill="#1673a8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
<tspan x="977.5" dy="0">BGP-LS AFI 16388</tspan>
<tspan x="977.5" dy="21.6">SAFI 71</tspan>
</text>
<text x="427.5" y="539.6400000000001" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
<tspan x="427.5" dy="0">Docker-published</tspan>
<tspan x="427.5" dy="21.6">localhost ports</tspan>
</text>
<text x="977.5" y="539.6400000000001" text-anchor="middle" fill="#b76a10" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
<tspan x="977.5" dy="0">BGP-LS AFI 16388</tspan>
<tspan x="977.5" dy="21.6">SAFI 71</tspan>
</text>
</svg>
